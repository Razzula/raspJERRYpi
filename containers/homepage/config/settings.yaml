title: ~/raspJERRYpi
description: Homelab dashboard

theme: dark
color: zinc

headerStyle: boxedWidgets
statusStyle: dot
iconStyle: theme

target: _blank
disableIndexing: true

fullWidth: true
maxGroupColumns: 4

layout:
  Infrastructure:
    style: row
    columns: 3

  Services:
    style: row
    columns: 3

  Dashboard:
    style: row
    columns: 3

  System:
    style: row
    columns: 3

  Links:
    style: row
    columns: 4

showStats: true
